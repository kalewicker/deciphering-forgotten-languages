[project]
name = "fl-decipher"
version = "0.1.0"
description = "Evidence-tracked Forgotten Languages pilot experiments"
requires-python = ">=3.12"
dependencies = ["beautifulsoup4>=4.12,<5"]

[project.scripts]
fl-decipher = "fl_decipher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fl_decipher"]
